name: Verify Football Trading build
on:
  push:
    branches: [fix/ft-reliability-20261010]
  pull_request:
    branches: [main]
jobs:
  next-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: football-trading-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: football-trading-v1/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
